<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Management System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- QR Code Library -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <!-- Custom Styles for Glassmorphism & Animations -->
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .dark .glass {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
        .dark .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(51, 65, 85, 0.5);
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.5); border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(156, 163, 175, 0.8); }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-300">

    <!-- LOGIN VIEW (Overlay/Section) -->
    <div id="login-view" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-md transition-opacity duration-300">
        <div class="glass-card p-8 rounded-2xl shadow-2xl w-full max-w-md mx-4 transform transition-all">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-brand-600 text-white rounded-2xl flex items-center justify-center text-2xl mx-auto shadow-lg shadow-brand-500/30 mb-4">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <h1 class="text-2xl font-bold">Activity Hub</h1>
                <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">เข้าสู่ระบบเพื่อจัดการกิจกรรมและลงทะเบียน</p>
            </div>
            <form id="login-form" class="space-y-4" onsubmit="handleLogin(event)">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">รหัสนักศึกษา / ไอดีผู้ใช้</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400"><i class="fa-regular fa-user"></i></span>
                        <input type="text" id="login-id" required class="w-full pl-10 pr-4 py-3 bg-slate-100 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm" placeholder="เช่น 6401001 หรือ admin">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">รหัสผ่าน</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" id="login-pass" required class="w-full pl-10 pr-4 py-3 bg-slate-100 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm" placeholder="••••••••">
                    </div>
                </div>
                <button type="submit" class="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white font-medium rounded-xl shadow-lg shadow-brand-600/30 transition-all flex items-center justify-center space-x-2">
                    <span>เข้าสู่ระบบ</span>
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
            </form>
            <div class="mt-6 text-center text-xs text-slate-400">
                <p>💡 ทดสอบระบบ: นักศึกษาพิมพ์รหัส เช่น <span class="text-brand-500 font-semibold">6401001</span> | แอดมินพิมพ์ <span class="text-brand-500 font-semibold">admin</span></p>
            </div>
        </div>
    </div>

    <!-- MAIN APP WRAPPER -->
    <div id="app-wrapper" class="flex h-screen overflow-hidden hidden">
        
        <!-- SIDEBAR -->
        <aside id="sidebar" class="w-64 glass border-r border-slate-200 dark:border-slate-800 flex flex-col transition-all duration-300 z-30">
            <div class="p-6 flex items-center space-x-3 border-b border-slate-200/50 dark:border-slate-800/50">
                <div class="w-10 h-10 bg-brand-600 text-white rounded-xl flex items-center justify-center font-bold shadow-md shadow-brand-500/20">
                    <i class="fa-solid fa-bolt text-sm"></i>
                </div>
                <div>
                    <span class="font-bold text-base tracking-tight block">Activity Hub</span>
                    <span class="text-xs text-slate-500 dark:text-slate-400" id="user-role-badge">นักศึกษา</span>
                </div>
            </div>

            <!-- Navigation Links -->
            <nav class="flex-1 px-4 py-6 space-y-1.5 overflow-y-auto" id="sidebar-nav">
                <!-- Dynamically injected based on role -->
            </nav>

            <!-- Sidebar Footer / Logout -->
            <div class="p-4 border-t border-slate-200/50 dark:border-slate-800/50">
                <button onclick="logout()" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-red-600 hover:bg-red-50 dark:hover:bg-red-950/30 transition-colors text-sm font-medium">
                    <i class="fa-solid fa-right-from-bracket w-5"></i>
                    <span>ออกจากระบบ</span>
                </button>
            </div>
        </aside>

        <!-- CONTENT AREA -->
        <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
            
            <!-- TOPBAR -->
            <header class="h-16 glass border-b border-slate-200/50 dark:border-slate-800/50 px-6 flex items-center justify-between z-20">
                <div class="flex items-center space-x-4">
                    <button onclick="toggleSidebar()" class="text-slate-500 hover:text-slate-700 dark:hover:text-slate-300">
                        <i class="fa-solid fa-bars text-lg"></i>
                    </button>
                    <h2 id="page-title" class="text-lg font-bold">Dashboard</h2>
                </div>
                <div class="flex items-center space-x-3">
                    <button onclick="toggleTheme()" class="w-10 h-10 rounded-xl glass-card flex items-center justify-center text-slate-600 dark:text-slate-300 hover:scale-105 transition-transform">
                        <i id="theme-icon" class="fa-solid fa-moon"></i>
                    </button>
                    <div class="flex items-center space-x-3 pl-3 border-l border-slate-200 dark:border-slate-800">
                        <div class="w-9 h-9 rounded-xl bg-brand-500/10 text-brand-600 dark:text-brand-400 flex items-center justify-center font-bold text-sm" id="user-avatar-initial">
                            U
                        </div>
                        <div class="hidden sm:block text-left">
                            <span class="text-xs font-bold block" id="header-user-name">กำลังโหลด...</span>
                            <span class="text-[10px] text-slate-500 dark:text-slate-400 block" id="header-user-id">-</span>
                        </div>
                    </div>
                </div>
            </header>

            <!-- MAIN VIEW CONTAINER -->
            <main class="flex-1 overflow-y-auto p-6 relative" id="main-content">
                <!-- Pages will be rendered here -->
            </main>
        </div>
    </div>

    <!-- GLOBAL MODAL -->
    <div id="global-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-md hidden transition-opacity">
        <div class="glass-card rounded-2xl shadow-2xl w-full max-w-lg mx-4 overflow-hidden transform transition-all" id="modal-content-wrapper">
            <!-- Modal Header -->
            <div class="px-6 py-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
                <h3 id="modal-title" class="font-bold text-lg">Modal Title</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <!-- Modal Body -->
            <div class="p-6 max-h-[70vh] overflow-y-auto" id="modal-body">
                <!-- Content -->
            </div>
        </div>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-50 space-y-2 pointer-events-none"></div>

    <!-- APPLICATION JAVASCRIPT -->
    <script>
        // ==========================================
        // 1. CONFIG & STATE VARIABLES
        // ==========================================
        const CONFIG = {
            PROXY_URL: "shababscanner.hem5426.workers.dev", // แทนที่ด้วย Apps Script Web App URL ของคุณ
            API_SECRET: "MySuperSecretKey123!@#"
        };

        let state = {
            currentUser: null, // { student_id, name, role: 'student'|'admin', faculty, ... }
            currentNav: 'dashboard',
            theme: 'dark',
            data: {
                activities: [],
                registrations: [],
                leaderboard: [],
                top7: []
            },
            loading: false
        };

        // ==========================================
        // 2. API WRAPPER
        // ==========================================
        async function apiCall(action, payload = {}) {
            // โหมดจำลองข้อมูล (Mock Data) หากยังไม่ได้เชื่อมต่อ Google Apps Script จริง
            if (CONFIG.PROXY_URL.includes("AKfycbz...")) {
                console.warn("Using Mock API Data (Update PROXY_URL for real backend)");
                return mockApiHandler(action, payload);
            }

            try {
                const response = await fetch(CONFIG.PROXY_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action, secret: CONFIG.API_SECRET, ...payload })
                });
                const result = await response.json();
                if (!result.success) throw new Error(result.message || 'API Error');
                return result.data;
            } catch (error) {
                showToast(error.message, 'error');
                throw error;
            }
        }

        // Mock Handler สำหรับการทดสอบโดยไม่ต้องมี Backend ทันที
        function mockApiHandler(action, payload) {
            return new Promise((resolve) => {
                setTimeout(() => {
                    if (action === 'login') {
                        if (payload.student_id === 'admin') {
                            resolve({ student_id: 'admin', name: 'System Admin', role: 'admin' });
                        } else {
                            resolve({ student_id: payload.student_id || '6401001', name: 'สมชาย ใจดี', role: 'student', faculty: 'วิศวกรรมศาสตร์', total_attendance: 5 });
                        }
                    } else if (action === 'loadAllData') {
                        resolve({
                            activities: [
                                { act_id: 'ACT001', title: 'อบรม AI & Machine Learning เบื้องต้น', date: '2026-08-20', time: '13:00 - 16:00', location: 'ห้อง Lab 301', status: 'upcoming', max_slots: 50, current_registered: 35 },
                                { act_id: 'ACT002', title: 'กิจกรรมจิตอาสาพัฒนาชุมชน', date: '2026-08-25', time: '08:00 - 12:00', location: 'ลานกิจกรรมกลางแจ้ง', status: 'upcoming', max_slots: 100, current_registered: 80 },
                                { act_id: 'ACT003', title: 'สัมภาษณ์ทุนการศึกษา WAMY', date: '2026-06-15', time: '10:00 - 12:00', location: 'Online (Zoom)', status: 'closed', max_slots: 20, current_registered: 20 }
                            ],
                            registrations: [
                                { reg_id: 'REG001', student_id: '6401001', student_name: 'สมชาย ใจดี', act_id: 'ACT001', act_title: 'อบรม AI & Machine Learning เบื้องต้น', attendance_status: 'registered', registered_at: '2026-08-10' },
                                { reg_id: 'REG002', student_id: '6401002', student_name: 'สมหญิง รักเรียน', act_id: 'ACT001', act_title: 'อบรม AI & Machine Learning เบื้องต้น', attendance_status: 'checked-in', registered_at: '2026-08-10' }
                            ],
                            leaderboard: [
                                { rank: 1, name: 'สมหญิง รักเรียน', faculty: 'วิทยาศาสตร์', total_attendance: 12 },
                                { rank: 2, name: 'สมชาย ใจดี', faculty: 'วิศวกรรมศาสตร์', total_attendance: 10 },
                                { rank: 3, name: 'กิตติ ศึกษา', faculty: 'บริหารธุรกิจ', total_attendance: 8 }
                            ],
                            top7: [
                                { name: 'สมหญิง รักเรียน', total_attendance: 12 },
                                { name: 'สมชาย ใจดี', total_attendance: 10 },
                                { name: 'กิตติ ศึกษา', total_attendance: 8 },
                                { name: 'มานี มีตา', total_attendance: 7 },
                                { name: 'ปิติ ดีใจ', total_attendance: 6 },
                                { name: 'ชูใจ ใฝ่รู้', total_attendance: 5 },
                                { name: 'วีระ กล้าหาญ', total_attendance: 4 }
                            ]
                        });
                    } else if (action === 'register') {
                        resolve({ message: 'ลงทะเบียนสำเร็จ' });
                    } else if (action === 'checkin') {
                        resolve({ message: 'เช็คอินสำเร็จ' });
                    } else {
                        resolve({ message: 'Success' });
                    }
                }, 400);
            });
        }

        // ==========================================
        // 3. AUTHENTICATION
        // ==========================================
        async function handleLogin(e) {
            e.preventDefault();
            const id = document.getElementById('login-id').value;
            const pass = document.getElementById('login-pass').value;

            try {
                const user = await apiCall('login', { student_id: id, password: pass });
                state.currentUser = user;
                localStorage.setItem('act_hub_user', JSON.stringify(user));
                
                document.getElementById('login-view').classList.add('opacity-0', 'pointer-events-none');
                setTimeout(() => document.getElementById('login-view').style.display = 'none', 300);
                document.getElementById('app-wrapper').classList.remove('hidden');
                
                initApp();
                showToast('เข้าสู่ระบบสำเร็จ', 'success');
            } catch (err) {
                // handled in apiCall
            }
        }

        function logout() {
            localStorage.removeItem('act_hub_user');
            state.currentUser = null;
            location.reload();
        }

        function checkSession() {
            const saved = localStorage.getItem('act_hub_user');
            if (saved) {
                state.currentUser = JSON.parse(saved);
                document.getElementById('login-view').style.display = 'none';
                document.getElementById('app-wrapper').classList.remove('hidden');
                initApp();
            }
        }

        // ==========================================
        // 4. INIT & DATA LOADING
        // ==========================================
        async function initApp() {
            setupNavigationMenu();
            updateHeaderUserInfo();
            await loadAllData();
            navigate(state.currentUser.role === 'admin' ? 'admin-dashboard' : 'dashboard');
        }

        async function loadAllData() {
            try {
                const result = await apiCall('loadAllData', { student_id: state.currentUser.student_id });
                state.data.activities = result.activities || [];
                state.data.registrations = result.registrations || [];
                state.data.leaderboard = result.leaderboard || [];
                state.data.top7 = result.top7 || [];
                renderCurrentPage();
            } catch (err) {
                console.error(err);
            }
        }

        // ==========================================
        // 5. NAVIGATION & RENDER ROUTER
        // ==========================================
        function setupNavigationMenu() {
            const nav = document.getElementById('sidebar-nav');
            const role = state.currentUser.role;
            document.getElementById('user-role-badge').innerText = role === 'admin' ? 'ผู้ดูแลระบบ (Admin)' : 'นักศึกษา';

            let html = '';
            if (role === 'student') {
                html = `
                    <a href="#" onclick="navigate('dashboard')" class="nav-link flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium transition-colors" data-page="dashboard"><i class="fa-solid fa-house w-5"></i><span>หน้าหลัก</span></a>
                    <a href="#" onclick="navigate('activities')" class="nav-link flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium transition-colors" data-page="activities"><i class="fa-solid fa-calendar-days w-5"></i><span>กิจกรรมทั้งหมด</span></a>
                    <a href="#" onclick="navigate('my-regs')" class="nav-link flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium transition-colors" data-page="my-regs"><i class="fa-solid fa-ticket w-5"></i><span>ประวัติการลงทะเบียน</span></a>
                    <a href="#" onclick="navigate('leaderboard')" class="nav-link flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium transition-colors" data-page="leaderboard"><i class="fa-solid fa-trophy w-5"></i><span>กระดานผู้นำ & Top 7</span></a>
                    <a href="#" onclick="navigate('profile')" class="nav-link flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium transition-colors" data-page="profile"><i class="fa-solid fa-user-gear w-5"></i><span>โปรไฟล์ของฉัน</span></a>
                `;
            } else {
                html = `
                    <a href="#" onclick="navigate('admin-dashboard')" class="nav-link flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium transition-colors" data-page="admin-dashboard"><i class="fa-solid fa-chart-pie w-5"></i><span>ภาพรวมระบบ</span></a>
                    <a href="#" onclick="navigate('admin-activities')" class="nav-link flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium transition-colors" data-page="admin-activities"><i class="fa-solid fa-calendar-plus w-5"></i><span>จัดการกิจกรรม</span></a>
                    <a href="#" onclick="navigate('admin-regs')" class="nav-link flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium transition-colors" data-page="admin-regs"><i class="fa-solid fa-clipboard-check w-5"></i><span>จัดการลงทะเบียน/เช็คอิน</span></a>
                    <a href="#" onclick="navigate('leaderboard')" class="nav-link flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium transition-colors" data-page="leaderboard"><i class="fa-solid fa-trophy w-5"></i><span>กระดานผู้นำ</span></a>
                `;
            }
            nav.innerHTML = html;
        }

        function navigate(page) {
            state.currentNav = page;
            document.querySelectorAll('.nav-link').forEach(el => {
                if (el.dataset.page === page) {
                    el.classList.add('bg-brand-600', 'text-white', 'shadow-md', 'shadow-brand-500/20');
                    el.classList.remove('text-slate-600', 'dark:text-slate-300', 'hover:bg-slate-100', 'dark:hover:bg-slate-800/50');
                } else {
                    el.classList.remove('bg-brand-600', 'text-white', 'shadow-md', 'shadow-brand-500/20');
                    el.classList.add('text-slate-600', 'dark:text-slate-300', 'hover:bg-slate-100', 'dark:hover:bg-slate-800/50');
                }
            });
            renderCurrentPage();
        }

        function renderCurrentPage() {
            const container = document.getElementById('main-content');
            const page = state.currentNav;
            
            // ตั้งชื่อ Title ด้านบน
            const titles = {
                'dashboard': 'หน้าหลัก / แดชบอร์ด',
                'activities': 'รายการกิจกรรมทั้งหมด',
                'my-regs': 'ประวัติการลงทะเบียนของฉัน',
                'leaderboard': 'กระดานผู้นำกิจกรรม & Top 7',
                'profile': 'โปรไฟล์ผู้ใช้งาน',
                'admin-dashboard': 'ภาพรวมระบบบริหารจัดการ',
                'admin-activities': 'จัดการข้อมูลกิจกรรม',
                'admin-regs': 'จัดการการลงทะเบียน & เช็คอิน'
            };
            document.getElementById('page-title').innerText = titles[page] || 'Dashboard';

            if (page === 'dashboard') renderStudentDashboard(container);
            else if (page === 'activities') renderActivitiesPage(container);
            else if (page === 'my-regs') renderMyRegistrations(container);
            else if (page === 'leaderboard') renderLeaderboardPage(container);
            else if (page === 'profile') renderProfilePage(container);
            else if (page === 'admin-dashboard') renderAdminDashboard(container);
            else if (page === 'admin-activities') renderAdminActivities(container);
            else if (page === 'admin-regs') renderAdminRegistrations(container);
        }

        // ==========================================
        // 6. RENDER FUNCTIONS (UI Components)
        // ==========================================
        function renderStudentDashboard(container) {
            const upcomingActs = state.data.activities.filter(a => a.status === 'upcoming').slice(0, 3);
            container.innerHTML = `
                <div class="space-y-6">
                    <!-- Welcome Banner -->
                    <div class="glass-card p-6 rounded-2xl relative overflow-hidden flex flex-col md:flex-row items-center justify-between shadow-sm">
                        <div class="relative z-10 mb-4 md:mb-0">
                            <span class="px-3 py-1 bg-brand-500/10 text-brand-600 dark:text-brand-400 rounded-full text-xs font-semibold">ยินดีต้อนรับกลับมา</span>
                            <h3 class="text-2xl font-bold mt-2">${state.currentUser.name}</h3>
                            <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">รหัสนักศึกษา: ${state.currentUser.student_id} | สะสมการเข้าร่วมแล้ว <span class="text-brand-600 font-bold">${state.currentUser.total_attendance || 5}</span> กิจกรรม</p>
                        </div>
                        <button onclick="navigate('activities')" class="px-5 py-3 bg-brand-600 hover:bg-brand-700 text-white font-medium rounded-xl shadow-lg shadow-brand-600/30 transition-all text-sm">
                            <i class="fa-solid fa-compass mr-2"></i>สำรวจกิจกรรมใหม่
                        </button>
                    </div>

        function updateHeaderUserInfo() {
            if (!state.currentUser) return;
            document.getElementById('header-user-name').innerText = state.currentUser.name;
            document.getElementById('header-user-id').innerText = state.currentUser.student_id;
            document.getElementById('user-avatar-initial').innerText = state.currentUser.name.charAt(0);
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `glass-card px-4 py-3 rounded-xl shadow-lg text-sm flex items-center space-x-2 transform translate-y-2 opacity-0 transition-all duration-300 pointer-events-auto ${type === 'error' ? 'border-red-500/50 text-red-500' : 'border-emerald-500/50 text-emerald-500'}`;
            toast.innerHTML = `<i class="fa-solid ${type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-check'}"></i><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // ==========================================
        // 10. KEYBOARD SHORTCUTS & INIT
        // ==========================================
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        console.info("%c Activity Hub Loaded Successfully! ", "background: #3b82f6; color: #fff; padding: 4px 8px; border-radius: 4px; font-weight: bold;");
        
        // Start app
        checkSession();
    </script>
</body>
</html>
